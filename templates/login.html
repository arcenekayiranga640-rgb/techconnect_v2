{% extends "base.html" %}
{% block title %}{{ t.login_title }} - TechConnect{% endblock %}
{% block content %}
<div class="card">
    <h1>{{ t.login_title }}</h1>
    <p class="hint">{{ t.login_hint }}</p>
    <form method="POST" action="{{ url_for('login') }}">
        <label for="email">{{ t.email_label }}</label>
        <input type="email" id="email" name="email" required>
        <label for="password">{{ t.password_label }}</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">{{ t.login_btn }}</button>
    </form>
    <p class="hint" style="margin-top:20px;">{{ t.no_profile }} <a href="{{ url_for('register') }}">{{ t.signup_link }}</a>.</p>
</div>
{% endblock %}
